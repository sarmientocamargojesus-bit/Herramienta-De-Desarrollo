spring.application.name=fast-food-backend
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:3}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Evita que Hibernate imprima la URL de conexión y sus parámetros en la terminal.
logging.level.org.hibernate.orm.connections.pooling=OFF

# JWT para la API REST. La clave debe tener como mínimo 32 caracteres.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:fast-food-api}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
