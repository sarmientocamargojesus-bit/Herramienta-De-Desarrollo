<header class="site-header">
      <a class="brand" routerLink="/" aria-label="Fast Food, ir al inicio"><span class="brand-mark">F<span>F</span></span><span>FAST<br>FOOD</span></a>
      <nav aria-label="Navegación principal">
        <a routerLink="/">Inicio</a>
        <a routerLink="/" fragment="menu">Menú</a>
        <a routerLink="/" fragment="nosotros">Nosotros</a>
      </nav>
      <div class="header-actions">
        @if (sesion.autenticado()) {
          @if (sesion.rol() === 'CLIENTE') { <a class="future-action" routerLink="/mis-pedidos">Mis pedidos</a> }
          @else { <a class="future-action" routerLink="/gestion">Gestión</a> }
          <button type="button" class="logout" (click)="salir()">Salir</button>
        } @else { <a class="future-action" routerLink="/iniciar-sesion">Iniciar sesión</a> }
        @if (!sesion.autenticado() || sesion.rol() === 'CLIENTE') {
          <a class="bag" routerLink="/carrito">Mi pedido <span>{{ carrito.items().length }}</span></a>
        }
      </div>
    </header>
