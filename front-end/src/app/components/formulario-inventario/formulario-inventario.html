<section class="pagina"><a routerLink="/gestion/inventario">← Inventario</a><h1>Ajustar stock mínimo</h1><app-mensaje-error [texto]="error()" />@if(inventario();as i){<div class="panel"><p><strong>{{i.producto.nombre}}</strong> · Stock actual: {{i.producto.stock}}</p><p>Las fechas de stock bajo y agotado las calcula el backend.</p><form class="formulario" [formGroup]="form" (ngSubmit)="guardar()"><label class="campo">Stock mínimo<input type="number" min="0" step="1" formControlName="stockMinimo" required /></label>@if(form.invalid && form.touched){<p class="ayuda">Usa un número entero no negativo.</p>}<button class="boton primario" [disabled]="enviando()">Guardar mínimo</button></form></div>}</section>
