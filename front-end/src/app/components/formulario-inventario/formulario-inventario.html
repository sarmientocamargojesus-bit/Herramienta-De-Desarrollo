<section class="pagina">
  <a routerLink="/gestion/inventario">← Inventario</a>
  <h1>Ajustar stock mínimo</h1>
  <app-mensaje-error [texto]="error()" />
  @if (inventario(); as i) {
    <div class="panel">
      <p>
        <strong>{{ i.producto.nombre }}</strong> · Stock actual: {{ i.producto.stock }}
      </p>
      <p>Las fechas de stock bajo y agotado las calcula el backend.</p>
      <form class="formulario" [formGroup]="form" (ngSubmit)="guardar()">
        <label class="campo"
          >Stock mínimo<input
            type="number"
            min="0"
            step="1"
            formControlName="stockMinimo"
            required
          />
          @if (form.controls.stockMinimo.touched && form.controls.stockMinimo.errors; as e) {
            <span class="ayuda">{{
              e['required'] ? 'Ingresa el stock mínimo.' : 'Usa un número entero de 0 o más.'
            }}</span>
          }
        </label>
        <button class="boton primario" [disabled]="enviando()">Guardar mínimo</button>
      </form>
    </div>
  }
</section>
