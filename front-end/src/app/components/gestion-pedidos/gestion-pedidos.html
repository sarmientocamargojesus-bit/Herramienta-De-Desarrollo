<section class="pagina"><h1>Pedidos</h1><p class="subtitulo">Pedidos registrados por el backend después del checkout.</p><app-mensaje-error [texto]="error()" /><div class="panel tabla-contenedor"><table class="tabla"><thead><tr><th>ID</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th>Total</th><th></th></tr></thead><tbody>@for(p of pedidos();track p.id){<tr><td>#{{p.id}}</td><td>{{p.usuario.nombre}}</td><td>{{p.fecha}}</td><td>{{p.estado}}</td><td>S/ {{p.total.toFixed(2)}}</td><td><a [routerLink]="['/gestion/pedidos',p.id]">Ver detalle</a></td></tr>}</tbody></table></div></section>
