<section class="pagina">
  <h1>Categorías</h1>
  <p class="subtitulo">Organiza el menú. Una categoría con productos no se puede eliminar.</p>
  <a class="boton primario" routerLink="/gestion/categorias/nueva">Nueva categoría</a
  ><app-mensaje-error [texto]="error()" />
  <div class="panel tabla-contenedor">
    <table class="tabla">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Activa</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (c of categorias(); track c.id) {
          <tr>
            <td>{{ c.nombre }}</td>
            <td>{{ c.descripcion }}</td>
            <td>{{ c.activo ? 'Sí' : 'No' }}</td>
            <td>
              <a [routerLink]="['/gestion/categorias', c.id, 'editar']">Editar</a> ·
              <button (click)="elegida.set(c)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <app-dialogo-confirmacion
    [abierto]="!!elegida()"
    titulo="Eliminar categoría"
    mensaje="¿Eliminar esta categoría? Si contiene productos, el backend rechazará la operación."
    (confirmar)="eliminar()"
    (cancelar)="elegida.set(null)"
  />
</section>
