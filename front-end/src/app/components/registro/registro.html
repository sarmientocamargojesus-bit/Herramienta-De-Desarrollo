<section class="pagina acceso"><div class="panel"><p class="eyebrow">ÚNETE A NOSOTROS</p><h1>Crear cuenta</h1><p class="subtitulo">Tu cuenta se crea con rol de cliente. Después podrás guardar el carrito y hacer pedidos.</p>
@if (error()) { <app-mensaje-error [texto]="error()" /> }
@if (listo()) { <p class="exito">Cuenta creada. Ahora puedes <a routerLink="/iniciar-sesion">iniciar sesión</a>.</p> }
@else { <form class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()"><label class="campo">Nombre<input formControlName="nombre" autocomplete="name" />@if (formulario.controls.nombre.touched && formulario.controls.nombre.invalid) { <span class="ayuda">Ingresa tu nombre.</span> }</label><label class="campo">Correo<input type="email" formControlName="correo" autocomplete="email" />@if (formulario.controls.correo.touched && formulario.controls.correo.invalid) { <span class="ayuda">Ingresa un correo válido.</span> }</label><label class="campo">Teléfono<input type="tel" formControlName="telefono" autocomplete="tel" />@if (formulario.controls.telefono.touched && formulario.controls.telefono.invalid) { <span class="ayuda">Ingresa tu teléfono.</span> }</label><label class="campo">Dirección (opcional)<input formControlName="direccion" autocomplete="street-address" /></label><label class="campo">Contraseña<input type="password" formControlName="contrasena" autocomplete="new-password" />@if (formulario.controls.contrasena.touched && formulario.controls.contrasena.invalid) { <span class="ayuda">Usa al menos 6 caracteres.</span> }</label><div class="acciones"><button class="boton primario" [disabled]="enviando()">{{ enviando() ? 'Creando…' : 'Crear cuenta' }}</button><a routerLink="/iniciar-sesion">Ya tengo cuenta</a></div></form> }</div></section>
