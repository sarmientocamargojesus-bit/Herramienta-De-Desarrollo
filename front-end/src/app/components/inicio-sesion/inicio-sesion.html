<section class="pagina acceso"><div class="panel"><p class="eyebrow">TU CUENTA</p><h1>Iniciar sesión</h1><p class="subtitulo">Entra para conservar tu carrito y confirmar tu pedido.</p>
  @if (error()) { <app-mensaje-error [texto]="error()" /> }
  <form class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()">
    <label class="campo">Correo electrónico<input type="email" formControlName="correo" autocomplete="email" />@if (formulario.controls.correo.touched && formulario.controls.correo.invalid) { <span class="ayuda">Escribe un correo válido.</span> }</label>
    <label class="campo">Contraseña<input type="password" formControlName="contrasena" autocomplete="current-password" />@if (formulario.controls.contrasena.touched && formulario.controls.contrasena.invalid) { <span class="ayuda">La contraseña es obligatoria.</span> }</label>
    <div class="acciones"><button class="boton primario" type="submit" [disabled]="enviando()">{{ enviando() ? 'Ingresando…' : 'Ingresar' }}</button><a routerLink="/registro">Crear cuenta</a></div>
  </form></div></section>
