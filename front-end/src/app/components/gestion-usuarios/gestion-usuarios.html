<section class="pagina"><h1>Usuarios</h1><p class="subtitulo">El cambio de rol conserva el nombre, teléfono y demás datos del usuario.</p><app-mensaje-error [texto]="error()" /><div class="panel tabla-contenedor"><table class="tabla"><thead><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Rol</th><th></th></tr></thead><tbody>@for(u of usuarios();track u.id){<tr><td>{{u.nombre}}</td><td>{{u.correo}}</td><td>{{u.telefono}}</td><td>{{u.rol}}</td><td><a [routerLink]="['/gestion/usuarios',u.id,'rol']">Cambiar rol</a></td></tr>}</tbody></table></div></section>
