<section class="pagina"><a routerLink="/">← Volver al menú</a><app-mensaje-error [texto]="error()" />@if(cargando()){<app-indicador-carga />}@if(producto(); as p){<div class="detalle panel"><img [src]="imagen(p.categoria)" alt="" /><div><p class="subtitulo">{{p.categoria}}</p><h1>{{p.nombre}}</h1><p>{{p.descripcion}}</p><p class="precio">S/ {{p.precio.toFixed(2)}}</p><p class="estado">{{p.stock > 0 ? p.stock + ' disponibles' : 'Agotado'}}</p><div class="acciones"><button class="boton primario" [disabled]="p.stock < 1" (click)="agregar()">Agregar al carrito</button><a class="boton secundario" routerLink="/carrito">Ver carrito</a></div>@if(aviso()){<p class="exito" role="status">{{aviso()}}</p>}</div></div>}</section>
