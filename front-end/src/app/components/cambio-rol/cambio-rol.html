<section class="pagina">
  <a routerLink="/gestion/usuarios">← Usuarios</a>
  <h1>Cambiar rol</h1>
  <app-mensaje-error [texto]="error()" />
  @if (usuario(); as u) {
    <form class="formulario panel" [formGroup]="form" (ngSubmit)="guardar()">
      <p>
        <strong>{{ u.nombre }}</strong
        ><br />{{ u.correo }} · {{ u.telefono }}
      </p>
      <p class="subtitulo">
        Solo se enviará el nuevo rol. El nombre, teléfono y demás datos permanecen intactos.
      </p>
      <label class="campo"
        >Rol<select formControlName="rol">
          <option value="CLIENTE">Cliente</option>
          <option value="EMPLEADO">Empleado</option>
          <option value="ADMINISTRADOR">Administrador</option>
        </select></label
      ><button class="boton primario" [disabled]="enviando()">Guardar rol</button>
    </form>
  }
</section>
