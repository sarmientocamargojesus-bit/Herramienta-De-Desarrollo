<app-portada />
<section class="menu-section" id="menu" aria-labelledby="menu-title">
  <div class="menu-inner">
    <div class="section-heading">
      <div>
        <p class="eyebrow">EL MENÚ</p>
        <h2 id="menu-title">ELIGE TU <em>ANTOJO.</em></h2>
        <p>Hamburguesas, combos, piqueos y bebidas preparados al momento.</p>
      </div>
      <span class="spark" aria-hidden="true">✳</span>
    </div>
    <app-mensaje-error [texto]="error()" [reintentable]="reintentable()" (reintentar)="cargar()" />
    @if (cargando()) {
      <app-indicador-carga />
    } @else {
      <label class="buscador"
        ><span>Buscar en el menú</span
        ><input type="search" [formControl]="busqueda" placeholder="Ej.: hamburguesa, papas…"
      /></label>
      <app-filtro-categorias
        [categories]="categorias()"
        [selected]="seleccion()"
        (categorySelected)="seleccion.set($event)"
      />
      @if (buscando()) {
        <p class="estado-busqueda" role="status">Buscando…</p>
      } @else if (termino() && !visibles().length) {
        <p class="estado-busqueda" role="status">
          No encontramos productos con «{{ termino() }}» en esta categoría.
        </p>
      } @else {
        <app-catalogo-productos [products]="visibles()" (agregar)="agregar($event)" />
      }
    }
  </div>
</section>
<app-sobre-nosotros />
