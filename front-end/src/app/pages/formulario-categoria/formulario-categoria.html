<section class="pagina">
  <a class="volver" routerLink="/gestion/categorias">← Categorías</a>
  <h1>{{ id ? 'Editar categoría' : 'Nueva categoría' }}</h1>
  <app-mensaje-error [texto]="error()" />
  <form class="formulario panel" [formGroup]="form" (ngSubmit)="guardar()">
    <label class="campo"
      >Nombre<input formControlName="nombre" required />
      @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
        <span class="ayuda">Escribe un nombre para la categoría.</span>
      }</label
    ><label class="campo"
      >Descripción<textarea formControlName="descripcion" rows="3"></textarea></label
    ><label class="casilla"><input type="checkbox" formControlName="activo" /> Categoría activa (visible en el menú)</label>
    <div class="acciones">
      <button class="boton primario" [disabled]="enviando()">{{ enviando() ? 'Guardando…' : 'Guardar categoría' }}</button
      ><a class="boton secundario" routerLink="/gestion/categorias">Cancelar</a>
    </div>
  </form>
</section>
