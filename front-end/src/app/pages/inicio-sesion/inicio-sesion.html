<section class="pagina acceso">
  <div class="panel">
    <p class="eyebrow">TU CUENTA</p>
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Entra para conservar tu carrito y confirmar tu pedido.</p>
    @if (recienRegistrado()) {
      <p class="exito" role="status">Cuenta creada. Escribe tu contraseña para ingresar.</p>
    }
    @if (error()) {
      <app-mensaje-error [texto]="error()" />
    }
    <form class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()">
      <label class="campo"
        >Correo electrónico<input type="email" formControlName="correo" autocomplete="email" />
        @if (formulario.controls.correo.touched && formulario.controls.correo.invalid) {
          <span class="ayuda">Escribe un correo válido.</span>
        }
      </label>
      <label class="campo"
        >Contraseña<input
          [type]="verContrasena() ? 'text' : 'password'"
          formControlName="contrasena"
          autocomplete="current-password"
        />
        @if (formulario.controls.contrasena.touched && formulario.controls.contrasena.invalid) {
          <span class="ayuda">La contraseña es obligatoria.</span>
        }
      </label>
      <label class="mostrar"
        ><input
          type="checkbox"
          [checked]="verContrasena()"
          (change)="verContrasena.set($any($event.target).checked)"
        />
        Mostrar contraseña</label
      >
      <div class="acciones">
        <button class="boton primario" type="submit" [disabled]="enviando()">
          {{ enviando() ? 'Ingresando…' : 'Ingresar' }}</button
        ><a routerLink="/registro">¿No tienes cuenta? Crear cuenta</a>
      </div>
    </form>
  </div>
</section>
