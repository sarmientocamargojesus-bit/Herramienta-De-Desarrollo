<div class="selector" role="group" [attr.aria-label]="etiqueta()">
  <button
    type="button"
    aria-label="Quitar una unidad"
    [disabled]="deshabilitado() || valor() <= minimo()"
    (click)="cambiar(-1)"
  >
    −
  </button>
  <span aria-live="polite">{{ valor() }}</span>
  <button
    type="button"
    aria-label="Agregar una unidad"
    [disabled]="deshabilitado() || valor() >= maximo()"
    (click)="cambiar(1)"
  >
    +
  </button>
</div>
